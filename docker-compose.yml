services:
  db:
    image: postgres:16-alpine
    container_name: tcc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: injuryrisk
    ports:
      - "5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injuryrisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
